name: Feature request
description: An idea for Agents Factory.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/AlexKhutor/agents-factory/blob/main/ROADMAP.md) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do with your agents, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Mockups and examples from other tools are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Atlas (map, chats, memory)
        - Agents and providers (Claude, Codex CLI, local agents)
        - Installation and CLI
        - MCP
        - Tasks and coordination
        - Other
